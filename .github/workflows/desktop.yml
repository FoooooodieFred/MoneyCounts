name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneycounts-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: error
