name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build macOS
        working-directory: desktop
        run: wails build -clean -platform darwin/universal
      - uses: actions/upload-artifact@v4
        with:
          name: moneycounts-macos
          path: desktop/build/bin/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build Windows
        working-directory: desktop
        run: wails build -clean -platform windows/amd64 -nsis -webview2 download -installscope user
      - uses: actions/upload-artifact@v4
        with:
          name: moneycounts-windows
          path: desktop/build/bin/
          if-no-files-found: error
